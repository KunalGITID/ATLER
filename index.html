<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <title>ATLER</title>
  <meta name="description" content="Subscriptions and spending: see your month before it happens.">
</head>
<body>
  <!--
    Launch screen. Painted from plain HTML before the app's JavaScript runs.
    Its ring is real progress (window.atlerLaunch.step), not decoration.
  -->
  <div id="launch" role="progressbar" aria-label="Loading ATLER" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15">
    <div class="launch-mark">
      <svg width="76" height="76" viewBox="0 0 76 76" fill="none" aria-hidden="true">
        <circle cx="38" cy="38" r="28" class="launch-track"></circle>
        <circle cx="38" cy="38" r="28" class="launch-arc" id="launch-arc"></circle>
      </svg>
    </div>
    <div class="launch-word">ATLER</div>
    <div class="launch-step" id="launch-step">Starting…</div>
  </div>
  <script>
    (function () {
      var C = 2 * Math.PI * 28;
      var el = document.getElementById('launch');
      var arc = document.getElementById('launch-arc');
      var label = document.getElementById('launch-step');
      var current = 0;
      function set(fraction, text) {
        current = Math.max(current, Math.min(1, fraction));
        arc.style.strokeDasharray = (C * current) + ' ' + C;
        el.setAttribute('aria-valuenow', String(Math.round(current * 100)));
        if (text) label.textContent = text;
      }
      window.atlerLaunch = {
        step: set,
        done: function () {
          set(1, 'Ready');
          setTimeout(function () { el.classList.add('launch-gone'); }, 120);
          setTimeout(function () { el.remove(); }, 520);
        }
      };
      set(0.15);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
